on:
  push:
    branches:
      - update-checking

name: Check for Container Image Updates

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.check-script.outputs.test }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: check-script
        name: Check for Updates
        run: |
          nix develop .# --command python3 util/check_updates.py

  change:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        test: [1]

    steps:
      - run: |
          echo '${{ fromJson(needs.checks.outputs.images) }}''
