on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

name: Check for Container Image Updates

permissions:
  contents: write
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      image-names: ${{ steps.check-script.outputs.image-names }}
      image-mappings: ${{ steps.check-script.outputs.image-mappings }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - id: check-script
        name: Check for Updates
        run: |
          nix develop .# --command python3 util/check_updates.py
      - run: |
          echo '${{ steps.check-script.outputs.image-names }}'
      - run: |
          echo '${{ steps.check-script.outputs.image-mappings }}'

  change:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        image-name: ${{ fromJson(needs.checks.outputs.image-names) }}
    if: ${{ !contains(needs.checks.outputs.image-names, '[]') }}

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"
      - id: update-script
        name: Check for Updates
        run: |
          nix develop .# --command python3 util/apply_update.py -i ${{matrix.image-name}} -u ${{fromJson(needs.checks.outputs.image-mappings)[matrix.image-name]}}
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: |
            [automated] chore: Automated update of image `${{matrix.image-name}}`

            Update `${{matrix.image-name}}` to `${{fromJson(needs.checks.outputs.image-mappings)[matrix.image-name]}}`
          branch: automated-updates/${{steps.date.outputs.date}}/${{matrix.image-name}}
          title: |
            [automated] chore: ${{steps.date.outputs.date}} update of `${{matrix.image-name}}`
          body: |
            Update `${{matrix.image-name}}` to `${{fromJson(needs.checks.outputs.image-mappings)[matrix.image-name]}}`
          reviewers: |
            archessmn
