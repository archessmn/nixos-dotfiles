on:
  push:
    branches:
      - update-checking

name: Check for Container Image Updates

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      image-names: ${{ steps.check-script.outputs.image-names }}
      image-mappings: ${{ steps.check-script.outputs.image-mappings }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - id: check-script
        name: Check for Updates
        run: |
          nix develop .# --command python3 util/check_updates.py
      - run: |
          echo '${{ steps.check-script.outputs.image-names }}'
      - run: |
          echo '${{ steps.check-script.outputs.image-mappings }}'

  change:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        image-name: ${{ fromJson(needs.checks.outputs.image-names) }}

    steps:
      - run: |
          echo '${{ matrix.image-name }}''
